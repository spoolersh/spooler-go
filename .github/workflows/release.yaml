# Files a release from a tag: the tagged commit must pass CI, and the tag
# must be on a commit whose version.go says exactly that, so the tagged tree
# and the constant always agree. A release is cut by hand: bump the
# constant, commit, tag that commit with the constant's value and push the
# tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # That the constant is a semantic version is TestVersion's job, run
      # by CI above; this step only ties the tag to it, and to the skill,
      # which describes one release: the one the tag names.
      - name: Check version
        run: |
          grep -Fxq "const Version = \"$GITHUB_REF_NAME\"" version.go
          grep -Fxq "  version: $GITHUB_REF_NAME" skills/spooler-go/SKILL.md

      # The module is the release; the page carries the notes from the
      # commits since the previous tag.
      - name: Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tells spoolersh/ai to mirror skills/spooler-go from this release, so
  # the copy there does not wait for the daily run. Its own job: the
  # release is out once the job above ends, and a failed dispatch must not
  # paint it red. GITHUB_TOKEN cannot dispatch to another repository;
  # MIRROR_TOKEN is a token with contents write on spoolersh/ai.
  mirror:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch
        run: |
          gh api repos/spoolersh/ai/dispatches \
            -f event_type=mirror \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[tag]=$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
