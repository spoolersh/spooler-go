# Checks a release: a tag v<X> must be on a commit whose version.go says X,
# so the tagged tree and the constant always agree. A release is cut by
# hand: bump the constant, commit, tag that commit v<X> and push the tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check version
        run: |
          grep -Fxq "const Version = \"${GITHUB_REF_NAME#v}\"" version.go
